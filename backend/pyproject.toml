[project]
name = "miniplane"
version = "0.1.0"
description = "MiniPlane - 轻量级团队项目协作与缺陷跟踪系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-filter>=24.0",
    "channels>=4.1",
    "daphne>=4.1",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.3",
    "django-storages[s3]>=1.14",
    "drf-spectacular>=0.27",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "watchfiles>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "watchfiles>=0.21",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
