[project]
name = "miniplane"
version = "0.1.0"
description = "MiniPlane - 轻量级团队项目协作与缺陷跟踪系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    "channels>=4.1",
    "daphne>=4.1",
    "celery>=5.4",
    "redis>=5.1",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "django-storages>=1.14",
    "boto3>=1.35",
    "gunicorn>=23.0",
    "uvicorn>=0.31",
    "Pillow>=11.0",
    "drf-spectacular>=0.28",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "model-bakery>=1.19",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
